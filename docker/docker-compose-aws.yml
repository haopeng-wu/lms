version: "3.7"
services:
  mariadb:
    image: mariadb:10.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed # Temporary fix for MariaDB 10.6
    environment:
      MYSQL_ROOT_PASSWORD: 123
    networks:
      - lms-network

  redis:
    image: redis:alpine
    networks:
      - lms-network

  frappe:
    image: 381491959099.dkr.ecr.eu-west-1.amazonaws.com/maple-repository:latest
    deploy:
      resources:
        limits:
          memory: 1G
    working_dir: /home/frappe
    command: bash /workspace/init_aws.sh
    ports:
      - 8000:8000
      - 9000:9000
    networks:
      - lms-network

networks:
  lms-network:
    driver: bridge
